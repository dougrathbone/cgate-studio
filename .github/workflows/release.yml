name: Release

# Manual releases — no automated version bumping.
#
# How to cut a release:
#   1. Bump "version" in package.json and add a CHANGELOG.md entry, commit to main.
#   2. Tag the commit and push the tag:
#        git tag v1.4.0 && git push origin v1.4.0
#   3. This workflow builds macOS (.dmg + .zip), Windows (NSIS .exe), and
#      Linux (AppImage) installers and publishes a GitHub Release for the tag.
#      Signing/notarization runs when the matching secrets are set; otherwise
#      the job ships unsigned (same as 1.3.0).
#
# You can also run it manually (workflow_dispatch) against an existing tag to
# (re)build and (re)attach installers — e.g. if a build needs to be redone.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish a release for (e.g. v1.4.0). The tag must already exist.
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-installer:
    name: Build installer (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the exact tagged commit (tag push -> ref_name; manual -> input).
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native installer (macOS)
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          if [ -n "$CSC_LINK" ]; then
            echo "macOS: signing + notarize"
            npx electron-builder --mac --publish never -c.mac.notarize=true
          else
            echo "macOS: unsigned fallback (MACOS_CSC_LINK unset)"
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish never -c.mac.identity=null
          fi

      - name: Build native installer (Windows)
        if: matrix.platform == 'win'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          npm run build
          if [ -n "$CSC_LINK" ]; then
            echo "Windows: Authenticode signing"
            npx electron-builder --win --publish never
          else
            echo "Windows: unsigned fallback (WIN_CSC_LINK unset)"
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --win --publish never
          fi

      - name: Build native installer (Linux)
        if: matrix.platform == 'linux'
        run: npm run dist:linux

      - name: List release outputs
        shell: bash
        run: |
          echo "Packaged artifacts:"
          ls -la release/ || true
          ls -la release/*.dmg release/*.exe release/*-mac.zip release/*.AppImage release/*.yml release/*.blockmap 2>/dev/null || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*-mac.zip
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  publish-installers:
    name: Attach installers to GitHub Release
    needs: build-installer
    if: ${{ always() && needs.build-installer.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers

      - name: List assets to publish
        run: find installers -type f | sort

      - name: Publish release with installers attached
        uses: softprops/action-gh-release@v2
        with:
          # Tag push -> ref_name; manual run -> the tag input. Creates the release
          # if it doesn't exist yet, otherwise attaches to the existing one.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.zip
            installers/**/*.AppImage
            installers/**/*.yml
            installers/**/*.blockmap
          fail_on_unmatched_files: false
          append_body: true
          body: |
            ## Installers

            | Platform | File | Notes |
            |----------|------|-------|
            | **macOS** | `.dmg` | Recommended — drag to Applications |
            | **macOS** | `-mac.zip` | Portable archive (Apple Silicon + Intel); used for auto-update |
            | **Windows** | `.exe` | NSIS installer — choose install directory |
            | **Linux** | `.AppImage` | x64 |

            Signing: **Developer ID + notarization** on macOS and **Authenticode** on Windows when the matching GitHub Actions secrets are set. If a platform secret is missing, that installer is **unsigned** (Gatekeeper / SmartScreen warnings). See [code signing](https://github.com/dougrathbone/cgate-studio/blob/main/docs/context/code-signing.md).

            Packaged apps check this GitHub Release for updates (Help → Check for Updates).
