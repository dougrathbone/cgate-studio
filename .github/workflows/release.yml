name: Release

# Automated semantic-versioning releases driven by Conventional Commits.
#
# How it works:
#   1. release-please watches `main`. As `feat:` / `fix:` / etc. commits land it
#      maintains a single "release PR" that bumps the version in package.json
#      (semver: feat -> minor, fix -> patch, `!`/BREAKING CHANGE -> major) and
#      regenerates CHANGELOG.md.
#   2. Merging that PR tags the commit `vX.Y.Z` and publishes a GitHub Release.
#   3. Native macOS (.dmg + .zip) and Windows (NSIS .exe) installers are built on
#      their respective runners and attached to that release in one upload step.
#
# Manual runs (workflow_dispatch) build installers as workflow artifacts only —
# useful for smoke-testing packaging without cutting a release.
#
# Installer builds live in this workflow (gated on `release_created`) on purpose.
# A tag pushed by release-please uses the default GITHUB_TOKEN, which does not
# re-trigger tag/`release`-triggered workflows — a separate tag-only workflow
# would never fire.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach installers to (e.g. v1.1.0)
        required: true
        default: v1.1.0

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-installer:
    name: Build installer (${{ matrix.platform }})
    needs: release-please
    # release-please may fail when Actions cannot open PRs; still build on manual runs.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native installer
        run: npm run dist:${{ matrix.platform }}
        env:
          # No Apple Developer / Windows code-signing cert in CI — ship unsigned
          # instead of failing the build.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List release outputs
        shell: bash
        run: |
          echo "Packaged artifacts:"
          ls -la release/
          ls -la release/*.dmg release/*.exe release/*-mac.zip 2>/dev/null || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*-mac.zip
          if-no-files-found: error
          retention-days: 30

  publish-installers:
    name: Attach installers to GitHub Release
    needs: [release-please, build-installer]
    if: >-
      ${{ always() && needs.build-installer.result == 'success'
      && (needs.release-please.outputs.release_created == 'true'
          || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers

      - name: List assets to publish
        run: find installers -type f | sort

      - name: Upload installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag }}
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.zip
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ## Installers

            | Platform | File | Notes |
            |----------|------|-------|
            | **macOS** | `.dmg` | Recommended — drag to Applications |
            | **macOS** | `-mac.zip` | Portable archive (Apple Silicon + Intel) |
            | **Windows** | `.exe` | NSIS installer — choose install directory |

            Installers are **unsigned** (no Apple / Windows code-signing certificate yet).
            See the [README](https://github.com/dougrathbone/cgate-studio#download) for first-launch steps.
