name: Release

# Manual releases — no automated version bumping.
#
# How to cut a release:
#   1. Bump "version" in package.json and add a CHANGELOG.md entry, commit to main.
#   2. Tag the commit and push the tag:
#        git tag v1.3.0 && git push origin v1.3.0
#   3. This workflow builds the macOS (.dmg + .zip) and Windows (NSIS .exe)
#      installers and publishes a GitHub Release for the tag with them attached.
#
# You can also run it manually (workflow_dispatch) against an existing tag to
# (re)build and (re)attach installers — e.g. if a build needs to be redone.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish a release for (e.g. v1.3.0). The tag must already exist.
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-installer:
    name: Build installer (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the exact tagged commit (tag push -> ref_name; manual -> input).
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native installer
        run: npm run dist:${{ matrix.platform }}
        env:
          # No Apple Developer / Windows code-signing cert in CI — ship unsigned
          # instead of failing the build.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List release outputs
        shell: bash
        run: |
          echo "Packaged artifacts:"
          ls -la release/
          ls -la release/*.dmg release/*.exe release/*-mac.zip 2>/dev/null || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*-mac.zip
          if-no-files-found: error
          retention-days: 30

  publish-installers:
    name: Attach installers to GitHub Release
    needs: build-installer
    if: ${{ always() && needs.build-installer.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers

      - name: List assets to publish
        run: find installers -type f | sort

      - name: Publish release with installers attached
        uses: softprops/action-gh-release@v2
        with:
          # Tag push -> ref_name; manual run -> the tag input. Creates the release
          # if it doesn't exist yet, otherwise attaches to the existing one.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.zip
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ## Installers

            | Platform | File | Notes |
            |----------|------|-------|
            | **macOS** | `.dmg` | Recommended — drag to Applications |
            | **macOS** | `-mac.zip` | Portable archive (Apple Silicon + Intel) |
            | **Windows** | `.exe` | NSIS installer — choose install directory |

            Installers are **unsigned** (no Apple / Windows code-signing certificate yet).
            See the [README](https://github.com/dougrathbone/cgate-studio#download) for first-launch steps.
