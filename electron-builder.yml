appId: com.dougrathbone.cbusstudio
productName: CBus Studio
copyright: Copyright © 2026 Doug Rathbone

# electron-vite bundles main/preload/renderer (including npm deps like xml2js)
# into out/, so the packaged app needs only out/ + package.json — no node_modules.
files:
  - out/**/*
  - package.json
asar: true

extraResources:
  - LICENSE

directories:
  output: release
  # Icons live under resources/ (build/ is gitignored).
  buildResources: resources

# App icon (light-bulb Control Console mark). electron-builder derives .icns/.ico.
icon: resources/icon.png

# electron-updater reads these from GitHub Releases (latest.yml / latest-mac.yml / latest-linux.yml).
publish:
  provider: github
  owner: dougrathbone
  repo: cgate-studio
  releaseType: release

mac:
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Universal binary: one .dmg/.zip for Apple Silicon and Intel Macs (built on CI arm64).
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  # Identity is left unset so CI can sign with CSC_LINK, or pass
  # -c.mac.identity=null for an unsigned fallback.

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  category: Utility
  target:
    - target: AppImage
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # electron-builder default; explicit for release artifact glob (*.exe).
  artifactName: ${productName} Setup ${version}.${ext}
