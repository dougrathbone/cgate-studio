appId: com.dougrathbone.cbusstudio
productName: CBus Studio
copyright: Copyright © 2026 Doug Rathbone

# electron-vite bundles main/preload/renderer (including npm deps like xml2js)
# into out/, so the packaged app needs only out/ + package.json — no node_modules.
files:
  - out/**/*
  - package.json
asar: true

extraResources:
  - LICENSE

directories:
  output: release
  buildResources: build

mac:
  category: public.app-category.utilities
  # Universal binary: one .dmg/.zip for Apple Silicon and Intel Macs (built on CI arm64).
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  # No Apple Developer cert wired up yet: ship unsigned (Gatekeeper will warn).
  # CI sets CSC_IDENTITY_AUTO_DISCOVERY=false so unsigned builds don't fail.
  identity: null

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # electron-builder default; explicit for release artifact glob (*.exe).
  artifactName: ${productName} Setup ${version}.${ext}
